name: Production Build & Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package.json

      - name: Install & Build
        working-directory: ./website
        run: |
          npm ci
          npm run build

      - name: Prepare Lambda Functions
        run: |
          cd website/services/lambda_gemini && npm install --production && zip -r ../../../gemini.zip . && cd ../../..
          cd website/services/lambda_resend && npm install --production && zip -r ../../../resend.zip . && cd ../../..    

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Apply
        id: tf
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="resend_api_key=${{ secrets.RESEND_API_KEY }}" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}"

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ./terraform
        run: |
          echo "bucket_name=$(terraform output -raw website_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Sync S3
        run: |
          aws s3 sync website/dist/ s3://${{ steps.outputs.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.cf_id }} \
            --paths "/*"
name: Production Build & Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'website/**'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add `environment: production` here to gate deploys behind a manual
    # approval. The OIDC trust policy already permits the resulting
    # `environment:production` subject claim (see iam_github_actions.tf).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install & Build
        working-directory: ./website
        run: |
          npm ci
          npm run build

      - name: Dependency Audit
        working-directory: ./website
        # Surfaces known high/critical advisories without blocking the deploy
        # on transitive issues outside our control.
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: Prepare Lambda Functions
        run: |
          cd website/services/lambda_gemini && zip -r ../../../gemini.zip . -x "node_modules/*" ".git/*" "*.md" && cd ../../..
          cd website/services/lambda_resend && zip -r ../../../resend.zip . -x "node_modules/*" ".git/*" "*.md" && cd ../../..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsWorkflowRole
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -recursive -check -diff

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        id: tf
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ./terraform
        run: |
          echo "bucket_name=$(terraform output -raw website_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Sync S3
        run: |
          aws s3 sync website/dist/ s3://${{ steps.outputs.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.cf_id }} \
            --paths "/*"
